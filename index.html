<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAI AUTO CARE | Auto detailing</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
:root{--bg:#F3F6FA;--fg:#0B1630;--muted:#47556F;--line:#D3DBE8;--panel:#050505;--panel2:#193457;--onpanel:#F5F8FC;--accent:#60c4bc;--green:#51a69f;--surface:#FFFFFF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05080F;--fg:#EAF0F8;--muted:#9AA9C2;--line:#1B2A44;--panel:#050505;--panel2:#162e4d;--surface:#0B1426}}
:root[data-theme="dark"]{--bg:#05080F;--fg:#EAF0F8;--muted:#9AA9C2;--line:#1B2A44;--panel:#050505;--panel2:#162e4d;--surface:#0B1426}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
header.hero{background:linear-gradient(135deg,var(--panel),var(--panel2));color:var(--onpanel);padding:48px 0 36px}
h1{font-stretch:125%;font-weight:900;font-size:clamp(2.4rem,11vw,4.6rem);line-height:.95;margin:0 0 14px;letter-spacing:-.01em}
.sub{font-size:1.1rem;max-width:34ch;margin:0 0 30px;opacity:.9}
.pick-label{font-weight:700;margin:0 0 10px}
.sizes{display:flex;flex-wrap:wrap;gap:8px}
.ex{margin:12px 0 0;font-size:.95rem;opacity:.85;max-width:60ch}
.sizes button{font:inherit;font-weight:700;color:var(--onpanel);background:transparent;border:2px solid rgba(242,247,249,.45);border-radius:999px;padding:10px 18px;cursor:pointer;min-height:44px}
.sizes button[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:#04202B}
button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
section.plans{padding:28px 0 8px;display:grid;gap:18px}
article{position:relative;padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:18px;min-width:0}
article.pop{border:2px solid var(--accent);box-shadow:0 12px 34px -18px var(--accent)}
.badge{position:absolute;top:-13px;left:22px;background:var(--accent);color:#04202B;font-weight:800;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;padding:5px 12px;border-radius:999px}
.cmp{margin:34px 0 10px;min-width:0}
.cmp h2{font-size:1.3rem;margin:0 0 4px}
.cmp .desc{margin:0 0 14px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:12px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
thead th{font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
tbody tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:color-mix(in srgb,var(--accent) 10%,transparent)}
tbody tr.on td{background:color-mix(in srgb,var(--accent) 22%,transparent);font-weight:800}
tbody tr:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
h2{font-stretch:112%;font-weight:800;font-size:1.6rem;margin:0}
.desc{color:var(--muted);margin:6px 0 0;max-width:46ch}
.price{font-stretch:125%;font-weight:900;font-size:3.2rem;line-height:1;border-bottom:6px solid var(--accent);padding-bottom:4px;transition:opacity .15s}
.price.swap{opacity:.2}
.note{display:block;font-size:.85rem;font-weight:500;color:var(--muted);margin-top:8px;text-align:right}
details{margin-top:16px}
summary{cursor:pointer;font-weight:700;padding:8px 0}
ul{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:8px 28px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
li{padding-left:26px;position:relative}
li::before{content:"";position:absolute;left:2px;top:.45em;width:12px;height:6px;border-left:3px solid var(--green);border-bottom:3px solid var(--green);transform:rotate(-45deg)}
footer{background:linear-gradient(135deg,var(--panel),var(--panel2));color:var(--onpanel);padding:34px 0;margin-top:20px}
footer p{margin:0 0 6px}
footer strong{font-stretch:112%;font-weight:800}
.lang{display:flex;gap:6px;justify-content:flex-end;margin-bottom:18px}
.lang button{font:inherit;font-weight:700;color:var(--onpanel);background:transparent;border:2px solid rgba(242,247,249,.45);border-radius:8px;padding:6px 12px;min-height:40px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--onpanel);color:#04202B;border-color:var(--onpanel)}
.cta-row{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 26px}
footer .cta-row{margin:12px 0 0}
.cta{display:inline-flex;align-items:center;min-height:46px;padding:0 22px;border-radius:999px;background:var(--accent);color:#04202B;font-weight:800;text-decoration:none}
.cta.alt{background:transparent;color:var(--onpanel);border:2px solid rgba(242,247,249,.5)}
a.cta:focus-visible{outline:3px solid var(--onpanel);outline-offset:3px}
summary:focus-visible{outline-color:var(--panel)}
.brand{background:#050505;display:flex;justify-content:center;padding:8px 20px 0}
.brand img{display:block;width:100%;max-width:420px;height:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
header.hero{padding-top:28px}
dialog{border:0;border-radius:16px;padding:22px;width:min(460px,92vw);background:var(--surface);color:var(--fg);box-shadow:0 20px 60px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(3,8,16,.65)}
dialog h3{font-stretch:112%;font-weight:800;font-size:1.4rem;margin:0}
.dv{font-weight:700;margin:4px 0 16px;color:var(--muted)}
.dq{font-weight:700;margin:0 0 8px}
.pays{display:flex;gap:8px;margin-bottom:12px}
.pays button{flex:1;font:inherit;font-weight:800;min-height:48px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.pays button[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:#04202B}
.di{margin:0 0 6px;font-weight:600}
.dn{margin:0 0 16px;font-size:.85rem;color:var(--muted)}
.choose{margin-top:14px;font:inherit;font-weight:800;min-height:46px;padding:0 20px;border-radius:999px;border:0;background:var(--accent);color:#04202B;cursor:pointer;width:100%}
.cta.alt2{border:2px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;font:inherit;font-weight:800}
dialog .cta-row{margin:0}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
body.intro .brand img{animation:fade 1.1s ease both}
body.intro .lang{animation:rise .7s ease .35s both}
body.intro .sub{animation:rise .7s ease .5s both}
body.intro header .cta-row{animation:rise .7s ease .65s both}
body.intro .pick-label{animation:rise .7s ease .8s both}
body.intro .sizes{animation:rise .7s ease .9s both}
body.intro article:nth-child(1){animation:rise .8s ease 1.1s both}
body.intro article:nth-child(2){animation:rise .8s ease 1.25s both}
body.intro article:nth-child(3){animation:rise .8s ease 1.4s both}
dialog[open]{animation:rise .3s ease both}
dialog[open]::backdrop{animation:fade .3s ease both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

var cur=0,sb=document.getElementById("sizes"),pl=document.getElementById("plans");
function $(i){return document.getElementById(i)}
function render(){
  var i18n=L==="es"?1:0,t=T[L];
  document.documentElement.lang=L;
  $("sub").textContent=t.sub;$("pl").textContent=t.pl;$("ct").textContent=t.ct;
  $("hc").textContent=t.call;$("fc").textContent=t.call;$("ft").textContent=t.txt;
  pl.setAttribute("aria-label",t.aria);
  Array.prototype.forEach.call(document.querySelectorAll(".lang button"),function(b){b.setAttribute("aria-pressed",b.getAttribute("data-l")===L?"true":"false")});
  sb.innerHTML="";
  SIZES.forEach(function(s,k){var b=document.createElement("button");b.type="button";b.setAttribute("role","radio");b.textContent=s[i18n];b.onclick=function(){cur=k;paint(true)};sb.appendChild(b)});
  pl.innerHTML=PK.map(function(p,i){return '<article'+(i===1?' class="pop"><span class="badge">'+t.pop+'</span>':'>')+'<div class="top"><div><h2>'+p.n[i18n]+'</h2><p class="desc">'+p.d[i18n]+'</p></div><div><div class="price" id="p'+i+'"></div><span class="note">'+p.u[i18n]+'</span></div></div><button type="button" class="choose" data-i="'+i+'">'+t.choose+'</button><details><summary>'+t.inc+'</summary><ul>'+p.f.map(function(x){return "<li>"+x[i18n]+"</li>"}).join("")+'</ul></details></article>'}).join("")+'<div class="cmp"><h2>'+t.cmp+'</h2><p class="desc">'+t.cmpd+'</p><div class="tw"><table><thead><tr><th scope="col">'+t.veh+'</th>'+PK.map(function(p){return '<th scope="col">'+["Express","Deluxe","Premium"][PK.indexOf(p)]+'</th>'}).join("")+'</tr></thead><tbody>'+SIZES.map(function(s,k){return '<tr tabindex="0" data-k="'+k+'"><td>'+s[i18n]+'</td>'+PRICE[k].map(function(v){return '<td>$'+v+'</td>'}).join("")+'</tr>'}).join("")+'</tbody></table></div></div>';
  paint(false);
  if($("dlg").open)payPaint();
}
function paint(anim){
  Array.prototype.forEach.call(sb.children,function(b,k){b.setAttribute("aria-checked",k===cur?"true":"false")});
  Array.prototype.forEach.call(pl.querySelectorAll("tbody tr"),function(r,k){r.classList.toggle("on",k===cur)});
  $("ex").textContent=T[L].ex+" "+EX[cur];
  PK.forEach(function(p,i){var e=$("p"+i);if(anim){e.classList.add("swap");setTimeout(function(){e.textContent="$"+PRICE[cur][i];e.classList.remove("swap")},120)}else{e.textContent="$"+PRICE[cur][i]}});
}
Array.prototype.forEach.call(document.querySelectorAll(".lang button"),function(b){b.onclick=function(){L=b.getAttribute("data-l");render()}});
var ZELLE="858-599-1111",pay="zelle",sel=0;
function payPaint(){
  var t=T[L],k=L==="es"?1:0,p=PK[sel],price="$"+PRICE[cur][sel],veh=SIZES[cur][k];
  $("dt").textContent=p.n[k];$("dv").textContent=veh+" – "+price;$("dq").textContent=t.pay;
  $("bz").textContent="Zelle";$("bc").textContent=t.cash;
  $("bz").setAttribute("aria-checked",pay==="zelle"?"true":"false");$("bc").setAttribute("aria-checked",pay==="cash"?"true":"false");
  $("di").textContent=pay==="zelle"?(ZELLE?t.zsend.replace("{p}",price)+" "+ZELLE:t.zask):t.cashT;
  $("dn").textContent=t.note;
  var body=t.body.replace("{pkg}",p.n[k]).replace("{veh}",veh).replace("{price}",price).replace("{pay}",pay==="zelle"?"Zelle":t.cash);
  $("dc").textContent=t.confirm;$("dc").href="sms:+18585991111?&body="+encodeURIComponent(body);
  $("dx").textContent=t.close;
}
function pickRow(e){var r=e.target.closest("tbody tr");if(r){cur=+r.getAttribute("data-k");paint(true)}}
pl.addEventListener("keydown",function(e){if((e.key==="Enter"||e.key===" ")&&e.target.closest("tbody tr")){e.preventDefault();pickRow(e)}});
pl.addEventListener("click",function(e){pickRow(e);var b=e.target.closest(".choose");if(b){sel=+b.getAttribute("data-i");pay="zelle";payPaint();$("dlg").showModal()}});
$("bz").onclick=function(){pay="zelle";payPaint()};
$("bc").onclick=function(){pay="cash";payPaint()};
$("dx").onclick=function(){$("dlg").close()};
$("dlg").addEventListener("click",function(e){if(e.target===$("dlg"))$("dlg").close()});
render();
